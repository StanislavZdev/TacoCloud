spring:
  application:
    name: taco-cloud

  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:5433/tacocloud?sslmode=require
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

        logging:
          level:
            com.example: INFO


